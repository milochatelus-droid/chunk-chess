<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Module Chunks — Prototype</title>
<style>
  :root {
    --bg: #1b1d21; --surface: #24272c; --surface2: #2c3036; --line: #3a3e45;
    --text: #e9e6df; --text-dim: #9a978f; --gold: #c9a24c; --green: #4f9d6e; --red: #c56458; --blue: #5f8ecb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; padding: 20px; }
  .app { max-width: 600px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 20px; }
  .eyebrow { font-family: monospace; color: var(--gold); font-size: 12px; text-transform: uppercase; }
  h1 { font-size: 22px; margin: 5px 0; }
  
  .status-bar { display: flex; justify-content: space-around; margin-bottom: 20px; background: var(--surface); padding: 10px; border-radius: 8px; border: 1px solid var(--line); }
  .pill b { color: var(--gold); font-family: monospace; }
  
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; text-align: center; }
  .instructions { font-size: 14px; color: var(--text-dim); margin-bottom: 15px; }
  
  .board-container { display: flex; justify-content: center; margin: 15px 0; }
  .board { display: grid; grid-template-columns: repeat(8, 40px); grid-template-rows: repeat(8, 40px); border: 2px solid var(--line); }
  .sq { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 26px; user-select: none; }
  .sq.light { background: #31353b; }
  .sq.dark { background: #25282d; }
  .sq.fx-green { background: rgba(79, 157, 110, 0.6) !important; }
  .sq.fx-red { background: rgba(197, 100, 88, 0.6) !important; }
  .sq.fx-blue { background: rgba(95, 142, 203, 0.5) !important; }
  
  .piece { color: var(--gold); cursor: pointer; }

  .palette { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; background: var(--surface2); padding: 10px; border-radius: 8px; }
  .palette-item { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 24px; background: var(--surface); cursor: pointer; }
  .palette-item.selected { border-color: var(--gold); background: #33291a; }

  .mini-boards-row { display: flex; justify-content: center; gap: 15px; margin: 15px 0; }
  .mini-card { background: var(--surface2); border: 2px solid var(--line); border-radius: 8px; padding: 8px; cursor: pointer; }
  .mini-card:hover { border-color: var(--gold); }
  .mini-board { display: grid; grid-template-columns: repeat(8, 16px); grid-template-rows: repeat(8, 16px); border: 1px solid var(--line); }
  .mini-sq { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; font-size: 10px; }
  .mini-sq.light { background: #31353b; }
  .mini-sq.dark { background: #25282d; }

  .btn { background: var(--gold); color: #1b1d21; border: none; border-radius: 6px; padding: 10px 20px; font-weight: 600; cursor: pointer; font-size: 14px; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="eyebrow">Prototype fonctionnel</div>
    <h1>Module Chunks (< 1200 ELO)</h1>
  </div>

  <div class="status-bar">
    <div class="pill">Niveau : <b id="lbl-level">Niveau 0</b></div>
    <div class="pill">Exposition : <b id="lbl-time">4500 ms</b></div>
    <div class="pill">Score : <b id="lbl-score">0 / 0</b></div>
  </div>

  <div class="card" id="stage-card"></div>
</div>

<script>
const CHUNK = {
  name: "Bouclier de pions du roi",
  pieces: [
    { type: "♔", square: "g1" },
    { type: "♙", square: "f2" },
    { type: "♙", square: "g2" },
    { type: "♙", square: "h2" }
  ]
};

const LEVELS = [
  { label: "Niveau 0 — Découverte", ms: 4500 },
  { label: "Niveau 1 — Consolidation", ms: 2250 },
  { label: "Niveau 2 — Accélération", ms: 1000 },
  { label: "Niveau 3 — Validation Flash", ms: 400 }
];

const ALL_SQUARES = [];
for (let r = 8; r >= 1; r--) {
  for (let f = 0; f < 8; f++) ALL_SQUARES.push(String.fromCharCode(97 + f) + r);
}

let levelIdx = 0, score = 0, attempts = 0, stage = "intro";
let recognitionChoice = null, placedPieces = {}, availablePalette = [], selectedPalettePiece = null;
let currentDistractors = [];

function getDistractors() {
  const optA = [...CHUNK.pieces];
  const optB = CHUNK.pieces.map(p => p.square === "f2" ? {...p, square: "f3"} : p);
  const optC = CHUNK.pieces.map(p => p.square === "g2" ? {...p, square: "g3"} : p);
  return [
    { pieces: optA, isCorrect: true },
    { pieces: optB, isCorrect: false },
    { pieces: optC, isCorrect: false }
  ].sort(() => Math.random() - 0.5);
}

function renderUI() {
  document.getElementById("lbl-level").innerText = LEVELS[levelIdx].label;
  document.getElementById("lbl-time").innerText = LEVELS[levelIdx].ms + " ms";
  document.getElementById("lbl-score").innerText = `${score} / ${attempts}`;

  const card = document.getElementById("stage-card");

  if (stage === "intro") {
    card.innerHTML = `
      <h2>Prêt à démarrer l'exercice ?</h2>
      <div class="instructions">Le chunk <b>"${CHUNK.name}"</b> va s'afficher pendant la durée impartie.</div>
      <button class="btn" onclick="startTrial()">Lancer l'Exposition</button>
    `;
  } 
  else if (stage === "expose") {
    card.innerHTML = `
      <h2>Phase d'Exposition</h2>
      <div class="instructions">Mémorisez le motif visuel...</div>
      ${generateBoardHTML(CHUNK.pieces.reduce((acc, p) => ({...acc, [p.square]: p.type}), {}))}
    `;
  } 
  else if (stage === "blank") {
    card.innerHTML = `<div style="padding: 60px 0; color: var(--text-dim);">— Écran Noir —</div>`;
  } 
  else if (stage === "recognize") {
    card.innerHTML = `
      <h2>Phase 1 — Reconnaissance Visuelle</h2>
      <div class="instructions">Cliquez sur le mini-échiquier correct :</div>
      <div class="mini-boards-row">
        ${currentDistractors.map((opt, idx) => `
          <div class="mini-card" onclick="selectRecognition(${idx})">
            ${generateMiniBoardHTML(opt.pieces)}
            <div style="margin-top:5px; font-family:monospace; font-size:11px;">Option ${String.fromCharCode(65 + idx)}</div>
          </div>
        `).join('')}
      </div>
    `;
  } 
  else if (stage === "reconstruct") {
    card.innerHTML = `
      <h2>Phase 2 — Reconstitution de Mémoire</h2>
      <div class="instructions">Cliquez sur une pièce puis sur sa case (ou cliquez sur une pièce posée pour l'enlever).</div>
      <div class="palette">
        ${availablePalette.map((piece, i) => `
          <div class="palette-item ${selectedPalettePiece === i ? 'selected' : ''}" onclick="selectPaletteItem(${i})">${piece}</div>
        `).join('')}
      </div>
      ${generateBoardHTML(placedPieces, true)}
      <div style="margin-top:15px;">
        <button class="btn" onclick="submitReconstruction()">Valider la Reconstitution</button>
      </div>
    `;
  } 
  else if (stage === "feedback") {
    const correctMap = CHUNK.pieces.reduce((acc, p) => ({...acc, [p.square]: p.type}), {});
    const fxMap = {};
    let perfect = true;

    ALL_SQUARES.forEach(sq => {
      if (placedPieces[sq] && placedPieces[sq] === correctMap[sq]) fxMap[sq] = "green";
      else if (placedPieces[sq] && placedPieces[sq] !== correctMap[sq]) { fxMap[sq] = "red"; perfect = false; }
      else if (!placedPieces[sq] && correctMap[sq]) { fxMap[sq] = "blue"; perfect = false; }
    });

    if (recognitionChoice !== true) perfect = false;

    card.innerHTML = `
      <h2>${perfect ? "🎉 Reconstitution Parfaite" : "⚠️ Erreur Détectée"}</h2>
      <div class="instructions">Vert = Correct, Rouge = Mal placé, Bleu = Omis.</div>
      ${generateBoardHTML({...correctMap, ...placedPieces}, false, fxMap)}
      <div style="margin-top:15px;">
        <button class="btn" onclick="nextTrial(${perfect})">Essai Suivant</button>
      </div>
    `;
  }
}

function startTrial() {
  placedPieces = {};
  availablePalette = ["♔", "♙", "♙", "♙"];
  selectedPalettePiece = null;
  stage = "expose";
  renderUI();

  setTimeout(() => {
    stage = "blank";
    renderUI();
    setTimeout(() => {
      currentDistractors = getDistractors();
      stage = "recognize";
      renderUI();
    }, 500);
  }, LEVELS[levelIdx].ms);
}

function selectRecognition(idx) {
  recognitionChoice = currentDistractors[idx].isCorrect;
  stage = "reconstruct";
  renderUI();
}

function selectPaletteItem(index) {
  selectedPalettePiece = selectedPalettePiece === index ? null : index;
  renderUI();
}

function clickSquare(sq) {
  if (selectedPalettePiece !== null && availablePalette[selectedPalettePiece]) {
    placedPieces[sq] = availablePalette[selectedPalettePiece];
    availablePalette.splice(selectedPalettePiece, 1);
    selectedPalettePiece = null;
    renderUI();
    return;
  }
  if (placedPieces[sq]) {
    availablePalette.push(placedPieces[sq]);
    delete placedPieces[sq];
    renderUI();
  }
}

function submitReconstruction() {
  attempts++;
  stage = "feedback";
  renderUI();
}

function nextTrial(isPerfect) {
  if (isPerfect) {
    score++;
    if (levelIdx < LEVELS.length - 1) levelIdx++;
  } else {
    if (levelIdx > 0) levelIdx--;
  }
  stage = "intro";
  renderUI();
}

function generateBoardHTML(piecesMap, interactive = false, fxMap = {}) {
  let html = `<div class="board-container"><div class="board">`;
  ALL_SQUARES.forEach(sq => {
    const file = sq.charCodeAt(0) - 97, rank = parseInt(sq[1]) - 1;
    const isLight = (file + rank) % 2 === 1;
    const fx = fxMap[sq] ? `fx-${fxMap[sq]}` : '';
    const piece = piecesMap[sq] || '';
    html += `
      <div class="sq ${isLight ? 'light' : 'dark'} ${fx}" 
           ${interactive ? `onclick="clickSquare('${sq}')"` : ''}>
        ${piece ? `<span class="piece">${piece}</span>` : ''}
      </div>`;
  });
  return html + `</div></div>`;
}

function generateMiniBoardHTML(piecesArray) {
  const map = piecesArray.reduce((acc, p) => ({...acc, [p.square]: p.type}), {});
  let html = `<div class="mini-board">`;
  ALL_SQUARES.forEach(sq => {
    const file = sq.charCodeAt(0) - 97, rank = parseInt(sq[1]) - 1;
    const isLight = (file + rank) % 2 === 1;
    const piece = map[sq] || '';
    html += `<div class="mini-sq ${isLight ? 'light' : 'dark'}">${piece ? `<span class="piece">${piece}</span>` : ''}</div>`;
  });
  return html + `</div>`;
}

renderUI();
</script>
</body>
</html>
