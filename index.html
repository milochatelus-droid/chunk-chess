<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Module Chunks — Position Réelle</title>
<style>
  :root {
    --bg: #121417; --surface: #1e2228; --surface2: #262c34; --line: #2e3540;
    --text: #f0f2f5; --text-dim: #9aa4b2; --gold: #d4af37; --gold-hover: #b89628;
    --green: #2e7d32; --red: #c62828; --blue: #1565c0;
    --sq-light: #e0e4ec; --sq-dark: #4b6584;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; padding: 20px 10px; display: flex; justify-content: center; }
  .app { width: 100%; max-width: 580px; }
  
  .header { text-align: center; margin-bottom: 15px; }
  .header h1 { font-size: 22px; margin: 4px 0; }
  .eyebrow { font-family: monospace; color: var(--gold); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }

  .status-bar { display: flex; justify-content: space-around; background: var(--surface); border: 1px solid var(--line); padding: 10px; border-radius: 10px; margin-bottom: 15px; font-size: 12px; }
  .status-item { text-align: center; }
  .status-item span { display: block; color: var(--text-dim); font-size: 10px; text-transform: uppercase; }
  .status-item b { color: var(--gold); font-size: 14px; font-family: monospace; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
  .instructions { font-size: 13px; color: var(--text-dim); margin-bottom: 15px; min-height: 32px; }

  .board-container { display: flex; justify-content: center; margin: 15px 0; }
  .board { display: grid; grid-template-columns: repeat(8, 42px); grid-template-rows: repeat(8, 42px); border: 3px solid var(--line); border-radius: 4px; overflow: hidden; }
  .sq { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 28px; user-select: none; }
  .sq.light { background: var(--sq-light); }
  .sq.dark { background: var(--sq-dark); }
  .sq.fx-green { background: rgba(46, 125, 50, 0.75) !important; }
  .sq.fx-red { background: rgba(198, 40, 40, 0.75) !important; }
  .sq.fx-blue { background: rgba(21, 101, 192, 0.65) !important; }
  .sq.drag-over { outline: 3px dashed var(--gold); outline-offset: -3px; }

  .piece { cursor: grab; line-height: 1; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4)); }
  .piece.black-piece { color: #000; filter: drop-shadow(0 2px 3px rgba(255,255,255,0.2)); }

  .palette-container { margin-bottom: 15px; }
  .palette-label { font-size: 11px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; }
  .palette { display: flex; justify-content: center; gap: 8px; background: var(--bg); padding: 10px; border-radius: 10px; border: 1px solid var(--line); min-height: 54px; align-items: center; flex-wrap: wrap; }
  .palette-item { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 24px; background: var(--surface); cursor: grab; }
  .palette-item.selected { border: 2px solid var(--gold); background: rgba(212, 175, 55, 0.15); }

  .mini-boards-row { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
  .mini-card { background: var(--bg); border: 2px solid var(--line); border-radius: 8px; padding: 6px; cursor: pointer; }
  .mini-card:hover { border-color: var(--gold); }
  .mini-board { display: grid; grid-template-columns: repeat(8, 15px); grid-template-rows: repeat(8, 15px); border: 1px solid var(--line); }
  .mini-sq { width: 15px; height: 15px; display: flex; align-items: center; justify-content: center; font-size: 10px; }
  .mini-sq.light { background: var(--sq-light); }
  .mini-sq.dark { background: var(--sq-dark); }

  .btn { background: var(--gold); color: #121417; border: none; border-radius: 8px; padding: 12px 24px; font-weight: 700; cursor: pointer; font-size: 14px; }
  .btn:hover { background: var(--gold-hover); }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="eyebrow">Encodage & Intégration</div>
    <h1>Module Chunks Tactiques</h1>
  </div>

  <div class="status-bar">
    <div class="status-item"><span>Phase</span><b id="lbl-phase">Phase 1</b></div>
    <div class="status-item"><span>Étape</span><b id="lbl-step">Chunk 1 / 4</b></div>
    <div class="status-item"><span>Exposition</span><b id="lbl-time">4500 ms</b></div>
  </div>

  <div class="card" id="stage-card"></div>
</div>

<script>
// --- CHUNKS EXTRAITS DE TON IMAGE ---
const CHUNKS_DATABASE = [
  {
    id: "c1_cavaliers",
    name: "Duo de Cavaliers Blancs",
    pieces: [ { type: "♘", square: "c3" }, { type: "♘", square: "e4" } ]
  },
  {
    id: "c2_roque_noir",
    name: "Roque Noir & 3 Pions",
    pieces: [ { type: "♚", square: "g8" }, { type: "♜", square: "f8" }, { type: "♟", square: "f7" }, { type: "♟", square: "g7" }, { type: "♟", square: "h7" } ]
  },
  {
    id: "c3_fianchetto",
    name: "Fianchetto Blanc du Roi",
    pieces: [ { type: "♔", square: "g1" }, { type: "♗", square: "g2" }, { type: "♙", square: "g3" }, { type: "♙", square: "f2" }, { type: "♙", square: "h2" } ]
  },
  {
    id: "c4_pions_centre",
    name: "Duo de Pions Centraux Blancs",
    pieces: [ { type: "♙", square: "c4" }, { type: "♙", square: "d4" } ]
  }
];

// --- POSITION COMPLÈTE ISSUE DE TON IMAGE (TEMPLATE PHASE 2) ---
const FULL_TEMPLATE_POSITION = [
  // Blancs
  { type: "♖", square: "a1" }, { type: "♗", square: "c1" }, { type: "♕", square: "d1" }, { type: "♖", square: "f1" }, { type: "♔", square: "g1" },
  { type: "♙", square: "b2" }, { type: "♙", square: "f2" }, { type: "♗", square: "g2" }, { type: "♙", square: "h2" },
  { type: "♙", square: "a3" }, { type: "♘", square: "c3" }, { type: "♙", square: "g3" },
  { type: "♙", square: "c4" }, { type: "♙", square: "d4" }, { type: "♘", square: "e4" },
  
  // Noirs
  { type: "♟", square: "b6" }, { type: "♟", square: "e6" }, { type: "♞", square: "f6" },
  { type: "♟", square: "a7" }, { type: "♝", square: "b7" }, { type: "♟", square: "c7" }, { type: "♞", square: "d7" }, { type: "♝", square: "e7" }, { type: "♟", square: "f7" }, { type: "♟", square: "g7" }, { type: "♟", square: "h7" },
  { type: "♜", square: "a8" }, { type: "♛", square: "c8" }, { type: "♜", square: "f8" }, { type: "♚", square: "g8" }
];

const TIME_STEPS = [4500, 2250, 1000, 400];
const chunkStats = {};
CHUNKS_DATABASE.forEach(c => chunkStats[c.id] = 0);

const ALL_SQUARES = [];
for (let r = 8; r >= 1; r--) {
  for (let f = 0; f < 8; f++) ALL_SQUARES.push(String.fromCharCode(97 + f) + r);
}

let currentPhase = 1; 
let currentChunkIndex = 0; 
let stage = "intro";
let currentPieces = [];
let placedPieces = {}, availablePalette = [], selectedPalettePiece = null;
let currentDistractors = [], recognitionChoice = null;

function getChunkExposureMs(chunkId) {
  const successes = chunkStats[chunkId] || 0;
  return TIME_STEPS[Math.min(successes, TIME_STEPS.length - 1)];
}

function getPhase2ExposureMs() {
  const minSuccess = Math.min(...CHUNKS_DATABASE.map(c => chunkStats[c.id]));
  return TIME_STEPS[Math.min(minSuccess, TIME_STEPS.length - 1)];
}

function setupCurrentStageData() {
  if (currentPhase === 1) {
    currentPieces = CHUNKS_DATABASE[currentChunkIndex].pieces;
  } else {
    currentPieces = FULL_TEMPLATE_POSITION;
  }
}

function getDistractors() {
  const target = [...currentPieces];
  const optA = target;
  const optB = target.map((p, i) => i === 0 ? {...p, square: p.square[0] + (parseInt(p.square[1]) === 1 ? 2 : parseInt(p.square[1])-1)} : p);
  const optC = target.map((p, i) => i === target.length - 1 ? {...p, square: p.square[0] + (parseInt(p.square[1]) === 8 ? 7 : parseInt(p.square[1])+1)} : p);

  return [
    { pieces: optA, isCorrect: true },
    { pieces: optB, isCorrect: false },
    { pieces: optC, isCorrect: false }
  ].sort(() => Math.random() - 0.5);
}

function renderUI() {
  setupCurrentStageData();

  const currentMs = currentPhase === 1 ? getChunkExposureMs(CHUNKS_DATABASE[currentChunkIndex].id) : getPhase2ExposureMs();
  document.getElementById("lbl-phase").innerText = currentPhase === 1 ? "Phase 1 (Chunk)" : "Phase 2 (Position)";
  document.getElementById("lbl-step").innerText = currentPhase === 1 ? `${currentChunkIndex + 1} / ${CHUNKS_DATABASE.length}` : "Template Complet";
  document.getElementById("lbl-time").innerText = `${currentMs} ms`;

  const card = document.getElementById("stage-card");

  if (stage === "intro") {
    const title = currentPhase === 1 
      ? `Chunk ${currentChunkIndex + 1} : ${CHUNKS_DATABASE[currentChunkIndex].name}` 
      : "Phase 2 : Position Intégrée Complète";
    const desc = currentPhase === 1 
      ? "Mémorisez ce motif isolé extrait de la position." 
      : "Reconstituez la position globale préexistante avec l'ensemble des pièces !";

    card.innerHTML = `
      <h2>${title}</h2>
      <div class="instructions">${desc}<br>Exposition : <b>${currentMs} ms</b></div>
      <button class="btn" onclick="startTrial()">Lancer l'Exposition</button>
    `;
  } 
  else if (stage === "expose") {
    const map = currentPieces.reduce((acc, p) => ({...acc, [p.square]: p.type}), {});
    card.innerHTML = `
      <h2>Exposition Visuelle</h2>
      <div class="instructions">Mémorisez le motif...</div>
      ${generateBoardHTML(map)}
    `;
  } 
  else if (stage === "blank") {
    card.innerHTML = `<div style="padding: 60px 0; color: var(--text-dim); font-style: italic;">— Écran Noir —</div>`;
  } 
  else if (stage === "recognize") {
    card.innerHTML = `
      <h2>1. Reconnaissance</h2>
      <div class="instructions">Sélectionnez la mini-carte correcte :</div>
      <div class="mini-boards-row">
        ${currentDistractors.map((opt, idx) => `
          <div class="mini-card" onclick="selectRecognition(${idx})">
            ${generateMiniBoardHTML(opt.pieces)}
            <div style="margin-top:4px; font-family:monospace; font-size:10px;">Option ${String.fromCharCode(65 + idx)}</div>
          </div>
        `).join('')}
      </div>
    `;
  } 
  else if (stage === "reconstruct") {
    card.innerHTML = `
      <h2>2. Reconstitution</h2>
      <div class="instructions">Glissez ou cliquez sur une pièce puis sur une case.</div>
      <div class="palette-container">
        <div class="palette-label">Réserve :</div>
        <div class="palette">
          ${availablePalette.map((piece, i) => `
            <div class="palette-item ${selectedPalettePiece === i ? 'selected' : ''}" 
                 draggable="true" 
                 ondragstart="handleDragStart(event, ${i})" 
                 onclick="selectPaletteItem(${i})">${piece}</div>
          `).join('')}
        </div>
      </div>
      ${generateBoardHTML(placedPieces, true)}
      <div style="margin-top:15px;">
        <button class="btn" onclick="submitReconstruction()">Valider</button>
      </div>
    `;
  } 
  else if (stage === "feedback") {
    const correctMap = currentPieces.reduce((acc, p) => ({...acc, [p.square]: p.type}), {});
    const fxMap = {};
    let perfect = true;

    ALL_SQUARES.forEach(sq => {
      if (placedPieces[sq] && placedPieces[sq] === correctMap[sq]) fxMap[sq] = "green";
      else if (placedPieces[sq] && placedPieces[sq] !== correctMap[sq]) { fxMap[sq] = "red"; perfect = false; }
      else if (!placedPieces[sq] && correctMap[sq]) { fxMap[sq] = "blue"; perfect = false; }
    });

    if (recognitionChoice !== true) perfect = false;

    card.innerHTML = `
      <h2>${perfect ? "🎉 Reconstitution Reussie !" : "⚠️ Erreur Détectée"}</h2>
      <div class="instructions">Vert = Correct | Rouge = Erreur | Bleu = Manquant.</div>
      ${generateBoardHTML({...correctMap, ...placedPieces}, false, fxMap)}
      <div style="margin-top:15px;">
        <button class="btn" onclick="nextStep(${perfect})">Étape Suivante</button>
      </div>
    `;
  }
}

function startTrial() {
  setupCurrentStageData();
  placedPieces = {};
  availablePalette = currentPieces.map(p => p.type);
  selectedPalettePiece = null;
  stage = "expose";
  renderUI();

  const ms = currentPhase === 1 ? getChunkExposureMs(CHUNKS_DATABASE[currentChunkIndex].id) : getPhase2ExposureMs();

  setTimeout(() => {
    stage = "blank";
    renderUI();
    setTimeout(() => {
      currentDistractors = getDistractors();
      stage = "recognize";
      renderUI();
    }, 400);
  }, ms);
}

function selectRecognition(idx) {
  recognitionChoice = currentDistractors[idx].isCorrect;
  stage = "reconstruct";
  renderUI();
}

function selectPaletteItem(index) {
  selectedPalettePiece = selectedPalettePiece === index ? null : index;
  renderUI();
}

function handleDragStart(e, paletteIndex) {
  e.dataTransfer.setData("text/plain", paletteIndex);
}

function handleDragOver(e) {
  e.preventDefault();
  e.currentTarget.classList.add("drag-over");
}

function handleDragLeave(e) {
  e.currentTarget.classList.remove("drag-over");
}

function handleDrop(e, sq) {
  e.preventDefault();
  e.currentTarget.classList.remove("drag-over");
  const paletteIndex = parseInt(e.dataTransfer.getData("text/plain"));
  if (!isNaN(paletteIndex) && availablePalette[paletteIndex]) {
    placedPieces[sq] = availablePalette[paletteIndex];
    availablePalette.splice(paletteIndex, 1);
    selectedPalettePiece = null;
    renderUI();
  }
}

function clickSquare(sq) {
  if (selectedPalettePiece !== null && availablePalette[selectedPalettePiece]) {
    placedPieces[sq] = availablePalette[selectedPalettePiece];
    availablePalette.splice(selectedPalettePiece, 1);
    selectedPalettePiece = null;
    renderUI();
    return;
  }
  if (placedPieces[sq]) {
    availablePalette.push(placedPieces[sq]);
    delete placedPieces[sq];
    renderUI();
  }
}

function submitReconstruction() {
  stage = "feedback";
  renderUI();
}

function nextStep(isPerfect) {
  if (currentPhase === 1) {
    const currentChunkId = CHUNKS_DATABASE[currentChunkIndex].id;
    if (isPerfect) {
      chunkStats[currentChunkId] = (chunkStats[currentChunkId] || 0) + 1;
    }

    if (currentChunkIndex < CHUNKS_DATABASE.length - 1) {
      currentChunkIndex++;
    } else {
      currentPhase = 2; // Pass à la Phase 2 après le 4e chunk
    }
  } else {
    currentPhase = 1;
    currentChunkIndex = 0;
  }

  stage = "intro";
  renderUI();
}

function generateBoardHTML(piecesMap, interactive = false, fxMap = {}) {
  let html = `<div class="board-container"><div class="board">`;
  ALL_SQUARES.forEach(sq => {
    const file = sq.charCodeAt(0) - 97, rank = parseInt(sq[1]) - 1;
    const isLight = (file + rank) % 2 === 1;
    const fx = fxMap[sq] ? `fx-${fxMap[sq]}` : '';
    const piece = piecesMap[sq] || '';
    
    const dragEvents = interactive ? `
      ondragover="handleDragOver(event)" 
      ondragleave="handleDragLeave(event)" 
      ondrop="handleDrop(event, '${sq}')" 
      onclick="clickSquare('${sq}')"
    ` : '';

    html += `
      <div class="sq ${isLight ? 'light' : 'dark'} ${fx}" ${dragEvents}>
        ${piece ? `<span class="piece">${piece}</span>` : ''}
      </div>`;
  });
  return html + `</div></div>`;
}

function generateMiniBoardHTML(piecesArray) {
  const map = piecesArray.reduce((acc, p) => ({...acc, [p.square]: p.type}), {});
  let html = `<div class="mini-board">`;
  ALL_SQUARES.forEach(sq => {
    const file = sq.charCodeAt(0) - 97, rank = parseInt(sq[1]) - 1;
    const isLight = (file + rank) % 2 === 1;
    const piece = map[sq] || '';
    html += `<div class="mini-sq ${isLight ? 'light' : 'dark'}">${piece ? `<span class="piece">${piece}</span>` : ''}</div>`;
  });
  return html + `</div>`;
}

renderUI();
</script>
</body>
</html>
